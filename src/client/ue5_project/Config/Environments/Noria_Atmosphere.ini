; ============================================================================
; DASI MMORPG - Unreal Engine 5 Environment Preset
; Noria_Atmosphere.ini
; Biome: Santuário Arbóreo de Feywood (Noria)
; Mood: Mystical bioluminescent twilight, ancient mother sequoias, amber sap, cyan & purple fungal spores
; ============================================================================

[EnvironmentPreset]
PresetName="Noria_Feywood_Bioluminescent"
BiomeType="Noria"
TimeOfDay=20.50 ; Mystical deep twilight
bEnableDynamicWeather=True
DefaultSporeIntensity=0.85
DefaultMistSaturation=0.60

; ----------------------------------------------------------------------------
; DIRECTIONAL LIGHT (Moonlight / Starlight Filtered through Giant Tree Canopy)
; ----------------------------------------------------------------------------
[/Script/Engine.DirectionalLightComponent]
Intensity=14000.0 ; Lumens (soft moonlight filtering through leaves)
LightColor=(R=180, G=245, B=215, A=255) ; Soft turquoise moonlight filtered by sacred leaves
SourceAngle=2.2
Temperature=7200.0
bUseTemperature=True
VolumetricScatteringIntensity=2.4 ; Rich God Rays between giant tree branches
CastVolumetricShadow=True
CastCloudShadows=False
CascadeCount=4
DynamicShadowDistanceMovableLight=18000.0

; ----------------------------------------------------------------------------
; SKY ATMOSPHERE (Deep Emerald Night Sky with Violet Nebulae)
; ----------------------------------------------------------------------------
[/Script/Engine.SkyAtmosphereComponent]
AtmosphereHeight=50.0
RayleighScattering=(R=0.035, G=0.12, B=0.08) ; Deep emerald green and turquoise scattering
RayleighScatteringScale=0.035
MieScattering=(R=0.015, G=0.045, B=0.035) ; Micro-spores in suspension
MieScatteringScale=0.012
MieAbsorption=(R=0.002, G=0.002, B=0.002)
MieAnisotropy=0.82
AbsorptionScale=0.002
GroundAlbedo=(R=0.05, G=0.22, B=0.10) ; Deep moss and bioluminescent lichen
MultiScatteringFactor=0.92

; ----------------------------------------------------------------------------
; VOLUMETRIC CLOUDS (Ethereal Night Wisps)
; ----------------------------------------------------------------------------
[/Script/Engine.VolumetricCloudComponent]
LayerBottomAltitude=2.5
LayerHeight=3.0
TracingStartMaxDistance=150.0
TracingMaxDistance=280.0
Albedo=(R=0.35, G=0.55, B=0.48)
ExtinctionCoeff=0.025
PhaseG=0.75
PhaseG2=-0.25
MultiScatteringApproximationOctaveCount=3
GroundContribution=0.35

; ----------------------------------------------------------------------------
; EXPONENTIAL HEIGHT FOG & VOLUMETRIC FOG (Bioluminescent Spore Canopy Mist)
; ----------------------------------------------------------------------------
[/Script/Engine.ExponentialHeightFogComponent]
FogDensity=0.045
FogHeightFalloff=0.0025 ; Fills ravines and tree roots
FogInscatteringColor=(R=0.05, G=0.28, B=0.22, A=1.0)
DirectionalInscatteringColor=(R=0.15, G=0.75, B=0.65, A=1.0)
DirectionalInscatteringExponent=8.0
DirectionalInscatteringStartDistance=800.0
bEnableVolumetricFog=True
VolumetricFogScatteringDistribution=0.72
VolumetricFogAlbedo=(R=0.20, G=0.85, B=0.70, A=1.0)
VolumetricFogExtinctionScale=1.85
VolumetricFogDistance=14000.0
SecondFogDensity=0.018
SecondFogHeightFalloff=0.0012
SecondFogHeightOffset=1200.0

; ----------------------------------------------------------------------------
; POST-PROCESS VOLUME (Lumen GI, Chaos Forge Magenta Highlights, Spore Bloom)
; ----------------------------------------------------------------------------
[/Script/Engine.PostProcessComponent]
bOverride_AutoExposureMethod=True
AutoExposureMethod=AEM_Manual
AutoExposureBias=1.05
bOverride_BloomMethod=True
BloomMethod=BM_FFT
BloomIntensity=2.4 ; Highlights bioluminescent mushrooms & Chaos Machine plasma
BloomThreshold=0.95
bOverride_ColorSaturation=True
ColorSaturation=(X=1.18, Y=1.25, Z=1.15, W=1.0) ; Vibrant emerald & azure saturation
bOverride_ColorContrast=True
ColorContrast=(X=1.12, Y=1.10, Z=1.12, W=1.0)
bOverride_ColorGamma=True
ColorGamma=(X=1.02, Y=1.04, Z=1.02, W=1.0)
