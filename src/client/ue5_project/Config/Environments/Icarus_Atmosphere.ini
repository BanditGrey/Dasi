; ============================================================================
; DASI MMORPG - Unreal Engine 5 Environment Preset
; Icarus_Atmosphere.ini
; Biome: Reino Celestial de Aethel / Ilhas Flutuantes (Icarus)
; Mood: Stratospheric floating islands above an infinite cloud sea, dazzling solar radiance, ethereal abyss
; ============================================================================

[EnvironmentPreset]
PresetName="Icarus_Celestial_CloudSea"
BiomeType="Icarus"
TimeOfDay=12.0 ; Pure zenith culmination above cloud layer
bEnableDynamicWeather=False ; Stratosphere stays perpetually radiant
CloudSeaElevationZ=-250000.0 ; Cloud deck top at -2500m relative to island plateau
AerialUpdraftStrength=450.0

; ----------------------------------------------------------------------------
; DIRECTIONAL LIGHT (Blinding High-Altitude Solar Flux)
; ----------------------------------------------------------------------------
[/Script/Engine.DirectionalLightComponent]
Intensity=120000.0 ; Lumens (pure high-altitude unattenuated solar radiation)
LightColor=(R=255, G=250, B=238, A=255) ; Brilliant celestial warm white-gold
SourceAngle=0.535 ; Crisp, sharp solar disk with razor specular highlights
Temperature=5500.0
bUseTemperature=True
VolumetricScatteringIntensity=1.2 ; Clean air with crisp god rays reflecting off cloud tops
CastVolumetricShadow=True
CastCloudShadows=False ; Island level is ABOVE the main cloud deck
CascadeCount=4
CascadeDistributionExponent=3.5
DynamicShadowDistanceMovableLight=35000.0

; ----------------------------------------------------------------------------
; SKY ATMOSPHERE (Thin Upper Stratosphere / Mesosphere)
; ----------------------------------------------------------------------------
[/Script/Engine.SkyAtmosphereComponent]
AtmosphereHeight=80.0 ; km
RayleighScattering=(R=0.015, G=0.045, B=0.185) ; Extremely deep cosmic indigo/violet at zenith
RayleighScatteringScale=0.032 ; Thinner atmospheric mass at high altitude
MieScattering=(R=0.002, G=0.003, B=0.005) ; Minimal aerosols / crystalline pure air
MieScatteringScale=0.001
MieAbsorption=(R=0.0005, G=0.0005, B=0.0005)
MieAnisotropy=0.92
GroundAlbedo=(R=0.92, G=0.95, B=1.0) ; Reflective cloud sea acts as second ground plane
MultiScatteringFactor=1.85 ; Dazzling radiant underlighting bouncing from cloud deck

; ----------------------------------------------------------------------------
; VOLUMETRIC CLOUDS (Infinite Billowing Cloud Sea Beneath Floating Islands)
; ----------------------------------------------------------------------------
[/Script/Engine.VolumetricCloudComponent]
LayerBottomAltitude=-4.5 ; km (situated below the island elevation plane)
LayerHeight=3.2 ; km
TracingStartMaxDistance=250.0 ; km
TracingMaxDistance=500.0 ; km
Albedo=(R=1.0, G=0.98, B=0.96) ; Pure brilliant sunlight reflection
ExtinctionCoeff=0.085 ; Very dense impenetrable cumulus deck
PhaseG=0.88 ; Brilliant forward scattering silver edges
PhaseG2=-0.42
MultiScatteringApproximationOctaveCount=5 ; Luminous diffuse bounce between cloud towers
GroundContribution=0.1

; ----------------------------------------------------------------------------
; EXPONENTIAL HEIGHT FOG (Ethereal Golden Horizon Haze & Bottomless Abyss)
; ----------------------------------------------------------------------------
[/Script/Engine.ExponentialHeightFogComponent]
FogDensity=0.008 ; Crystal-clear stratosphere around islands
FogHeightFalloff=0.0004
FogInscatteringColor=(R=0.55, G=0.75, B=1.0, A=1.0) ; Pale celestial cyan horizon
DirectionalInscatteringColor=(R=1.0, G=0.92, B=0.75, A=1.0) ; Radiant solar god aura
DirectionalInscatteringExponent=32.0
DirectionalInscatteringStartDistance=4000.0
bEnableVolumetricFog=True
VolumetricFogScatteringDistribution=0.75
VolumetricFogAlbedo=(R=0.95, G=0.96, B=1.0, A=1.0)
VolumetricFogExtinctionScale=0.65
VolumetricFogDistance=45000.0 ; Vast visibility across floating archipelago
SecondFogDensity=0.065 ; Dense fog pool in the abyss below cloud deck
SecondFogHeightFalloff=0.0025
SecondFogHeightOffset=-300000.0

; ----------------------------------------------------------------------------
; POST-PROCESS VOLUME (Celestial Bloom, Lens Flares, High Dynamic Range)
; ----------------------------------------------------------------------------
[/Script/Engine.PostProcessComponent]
bOverride_AutoExposureMethod=True
AutoExposureMethod=AEM_Manual
AutoExposureBias=2.15 ; Tuned for extreme 120,000 lux illumination
bOverride_BloomMethod=True
BloomMethod=BM_FFT
BloomIntensity=3.2 ; Radiant divine aura blooms
BloomThreshold=1.8
bOverride_LensFlareIntensity=True
LensFlareIntensity=1.65 ; Prismatic starbursts and iris rings
LensFlareBokehSize=18.0
LensFlareThreshold=2.5
bOverride_ColorSaturation=True
ColorSaturation=(X=1.08, Y=1.05, Z=1.02, W=1.0)
bOverride_ColorContrast=True
ColorContrast=(X=1.15, Y=1.12, Z=1.08, W=1.0)
bOverride_ColorGamma=True
ColorGamma=(X=1.02, Y=1.01, Z=0.99, W=1.0)
bOverride_VignetteIntensity=True
VignetteIntensity=0.22
bOverride_LumenReflections=True
LumenReflectionsQuality=2.0

; ----------------------------------------------------------------------------
; AERIAL FLIGHT DYNAMICS & WIND CURRENTS
; ----------------------------------------------------------------------------
[DasiEnvironmentalVFX]
EnvironmentalNiagaraSystem="/Game/VFX/Niagara/Environments/NS_IcarusThermalUpdrafts.NS_IcarusThermalUpdrafts"
WindVelocityVector=(X=120.0, Y=65.0, Z=450.0) ; Vertical convective thermal currents
FeatherMoteCount=120.0 ; Floating sacred feathers and golden pollen motes

; ----------------------------------------------------------------------------
; WORLD PARTITION & STREAMING DATA LAYERS
; ----------------------------------------------------------------------------
[DasiWorldPartition]
GridCellSize=25600.0 ; 256m larger cells for vast aerial expanse
LoadingRange=64000.0 ; 640m streaming distance for visible distant sky islands
HLODLayer_Default="/Game/World/HLOD/HLOD_IcarusFloatingIslands"
HLODLayer_SkyArch="/Game/World/HLOD/HLOD_IcarusBridges"
DataLayers=["DL_Icarus_LandingPlatform", "DL_Icarus_AethelSanctuary", "DL_Icarus_FloatingRuins", "DL_Icarus_AbyssWinds"]
