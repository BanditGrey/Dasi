; ============================================================================
; DASI MMORPG - Unreal Engine 5 Environment Preset
; Lorencia_Atmosphere.ini
; Biome: Planícies Cinzentas & Castelo de Loren (Lorencia)
; Mood: Somber, rainy, wet cobblestone courtyards, ground-creeping mist, medieval stone
; ============================================================================

[EnvironmentPreset]
PresetName="Lorencia_GreyPlains_Rainy"
BiomeType="Lorencia"
TimeOfDay=16.85 ; Late rainy afternoon
bEnableDynamicWeather=True
DefaultRainIntensity=0.65
DefaultWetnessSaturation=0.85

; ----------------------------------------------------------------------------
; DIRECTIONAL LIGHT (Rainy, Low Solar Angle Piercing Heavy Clouds)
; ----------------------------------------------------------------------------
[/Script/Engine.DirectionalLightComponent]
Intensity=28000.0 ; Lumens (dim overcast daylight)
LightColor=(R=245, G=220, B=195, A=255) ; Muted warm sepia piercing grey clouds
SourceAngle=1.85 ; Softer sun disk through overcast stratus
Temperature=5800.0
bUseTemperature=True
VolumetricScatteringIntensity=1.65
CastVolumetricShadow=True
CastCloudShadows=True
CloudShadowStrength=0.85
CloudShadowExtent=150000.0
CascadeCount=4
CascadeDistributionExponent=3.2
DynamicShadowDistanceMovableLight=22000.0

; ----------------------------------------------------------------------------
; SKY ATMOSPHERE (Sepia / Desaturated Stormy Troposphere)
; ----------------------------------------------------------------------------
[/Script/Engine.SkyAtmosphereComponent]
AtmosphereHeight=60.0 ; km
RayleighScattering=(R=0.085, G=0.075, B=0.065) ; Heavy brownish-grey dust & moisture scattering
RayleighScatteringScale=0.045
MieScattering=(R=0.018, G=0.016, B=0.014) ; High aerosol concentration from constant rain
MieScatteringScale=0.0075
MieAbsorption=(R=0.0035, G=0.0035, B=0.0035)
MieAnisotropy=0.78
AbsorptionScale=0.0018
TentDistribution=(R=0.0, G=0.0, B=0.0)
GroundAlbedo=(R=0.12, G=0.10, B=0.08) ; Mud and dark sodalite stone
MultiScatteringFactor=0.85

; ----------------------------------------------------------------------------
; VOLUMETRIC CLOUDS (Dense Overcast Stratocumulus with Rain Bases)
; ----------------------------------------------------------------------------
[/Script/Engine.VolumetricCloudComponent]
LayerBottomAltitude=1.8 ; km
LayerHeight=4.2 ; km
TracingStartMaxDistance=180.0 ; km
TracingMaxDistance=350.0 ; km
Albedo=(R=0.68, G=0.66, B=0.65) ; Storm grey
ExtinctionCoeff=0.045 ; Dense light absorption
PhaseG=0.82 ; Strong forward light scattering
PhaseG2=-0.35 ; Backscatter silver lining
MultiScatteringApproximationOctaveCount=4
GroundContribution=0.25

; ----------------------------------------------------------------------------
; EXPONENTIAL HEIGHT FOG & VOLUMETRIC FOG (Low Creeping Ground Mist)
; ----------------------------------------------------------------------------
[/Script/Engine.ExponentialHeightFogComponent]
FogDensity=0.038
FogHeightFalloff=0.0035 ; Confined to lowest 250m terrain elevations (ruts and moats)
FogInscatteringColor=(R=0.22, G=0.20, B=0.19, A=1.0)
DirectionalInscatteringColor=(R=0.45, G=0.38, B=0.30, A=1.0)
DirectionalInscatteringExponent=12.0
DirectionalInscatteringStartDistance=1200.0
bEnableVolumetricFog=True
VolumetricFogScatteringDistribution=0.68
VolumetricFogAlbedo=(R=0.72, G=0.70, B=0.68, A=1.0)
VolumetricFogExtinctionScale=2.2
VolumetricFogDistance=16000.0
SecondFogDensity=0.012
SecondFogHeightFalloff=0.0015
SecondFogHeightOffset=800.0

; ----------------------------------------------------------------------------
; POST-PROCESS VOLUME (Lumen GI, Film Tone-Mapper, Reflective Puddle SSR)
; ----------------------------------------------------------------------------
[/Script/Engine.PostProcessComponent]
bOverride_AutoExposureMethod=True
AutoExposureMethod=AEM_Manual
AutoExposureBias=1.15
bOverride_BloomMethod=True
BloomMethod=BM_FFT ; Cinema-grade lens bloom on torchlights & jewel drops
BloomIntensity=1.8
BloomThreshold=1.2
bOverride_ColorSaturation=True
ColorSaturation=(X=0.82, Y=0.80, Z=0.78, W=1.0) ; Desaturated melancholic Lorencia tone
bOverride_ColorContrast=True
ColorContrast=(X=1.08, Y=1.06, Z=1.04, W=1.0)
bOverride_ColorGamma=True
ColorGamma=(X=0.98, Y=0.96, Z=0.94, W=1.0)
bOverride_VignetteIntensity=True
VignetteIntensity=0.38
bOverride_LumenReflections=True
LumenReflectionsQuality=2.5 ; High-definition mud and cobblestone puddle reflections
LumenRoughnessMode=1 ; Rough reflections enabled
LumenMaxRayIntensity=25.0

; ----------------------------------------------------------------------------
; WORLD PARTITION & STREAMING DATA LAYERS
; ----------------------------------------------------------------------------
[DasiWorldPartition]
GridCellSize=12800.0 ; 128m grid cells
LoadingRange=38400.0 ; 384m streaming radius for dense city & castle assets
HLODLayer_Default="/Game/World/HLOD/HLOD_LorenciaLandscape"
HLODLayer_CastleStructures="/Game/World/HLOD/HLOD_LorenciaCastle"
DataLayers=["DL_Lorencia_BaseTerrain", "DL_Lorencia_CastleCore", "DL_Lorencia_MuddyPlains", "DL_Lorencia_SpiderCaves"]
