; ============================================================================
; DASI MMORPG - Unreal Engine 5 Environment Preset
; Atlans_Atmosphere.ini
; Biome: Ruínas Submersas de Thalassa (Atlans)
; Mood: Underwater oceanic abyss, caustic sunlight rays, Nácar marble, coral reefs, hydrothermal vents
; ============================================================================

[EnvironmentPreset]
PresetName="Atlans_Thalassa_OceanAbyss"
BiomeType="Atlans"
TimeOfDay=13.00 ; High noon penetrating water column
bEnableDynamicWeather=False
bEnableUnderwaterPhysics=True
WaterDepthScale=260.0 ; Meters from surface (0m) to abyss (-260m)

; ----------------------------------------------------------------------------
; DIRECTIONAL LIGHT (Sunlight Piercing Water Surface with Caustic God Rays)
; ----------------------------------------------------------------------------
[/Script/Engine.DirectionalLightComponent]
Intensity=65000.0 ; High lumens to penetrate water absorption column
LightColor=(R=120, G=225, B=255, A=255) ; Caribbean turquoise & cyan hue
SourceAngle=3.5
Temperature=8500.0
bUseTemperature=True
VolumetricScatteringIntensity=3.8 ; High volumetric caustics
CastVolumetricShadow=True
CastCloudShadows=False
CascadeCount=4
DynamicShadowDistanceMovableLight=25000.0

; ----------------------------------------------------------------------------
; SKY ATMOSPHERE (Simulated Ocean Surface Ceiling & Water Column)
; ----------------------------------------------------------------------------
[/Script/Engine.SkyAtmosphereComponent]
AtmosphereHeight=20.0
RayleighScattering=(R=0.012, G=0.085, B=0.180) ; Heavy blue-green oceanic scattering
RayleighScatteringScale=0.095
MieScattering=(R=0.010, G=0.045, B=0.090) ; Marine snow and phytoplankton particles
MieScatteringScale=0.035
MieAbsorption=(R=0.085, G=0.015, B=0.002) ; Beer-Lambert red wavelength absorption
MieAnisotropy=0.88
AbsorptionScale=0.045
GroundAlbedo=(R=0.75, G=0.72, B=0.65) ; White pearl quartz sand reflection
MultiScatteringFactor=0.95

; ----------------------------------------------------------------------------
; EXPONENTIAL HEIGHT FOG & VOLUMETRIC FOG (Underwater Hydrosphere Density)
; ----------------------------------------------------------------------------
[/Script/Engine.ExponentialHeightFogComponent]
FogDensity=0.085 ; Dense water fog
FogHeightFalloff=0.0008 ; Uniform water density across vertical column
FogInscatteringColor=(R=0.01, G=0.08, B=0.18, A=1.0)
DirectionalInscatteringColor=(R=0.05, G=0.45, B=0.75, A=1.0)
DirectionalInscatteringExponent=6.0
DirectionalInscatteringStartDistance=200.0
bEnableVolumetricFog=True
VolumetricFogScatteringDistribution=0.85
VolumetricFogAlbedo=(R=0.10, G=0.65, B=0.85, A=1.0)
VolumetricFogExtinctionScale=3.2 ; Simulates Beer-Lambert oceanic light loss
VolumetricFogDistance=12000.0
SecondFogDensity=0.045
SecondFogHeightFalloff=0.0004
SecondFogHeightOffset=-15000.0 ; Deep volcanic abyss

; ----------------------------------------------------------------------------
; POST-PROCESS VOLUME (Lumen GI, Caustic Projections, Depth Fog & Bubble Bloom)
; ----------------------------------------------------------------------------
[/Script/Engine.PostProcessComponent]
bOverride_AutoExposureMethod=True
AutoExposureMethod=AEM_Manual
AutoExposureBias=1.35
bOverride_BloomMethod=True
BloomMethod=BM_FFT
BloomIntensity=2.2 ; Bioluminescent coral & bubble specular flares
BloomThreshold=0.85
bOverride_ColorSaturation=True
ColorSaturation=(X=1.20, Y=1.30, Z=1.35, W=1.0) ; Deep marine richness
bOverride_ColorContrast=True
ColorContrast=(X=1.15, Y=1.12, Z=1.10, W=1.0)
bOverride_ColorGamma=True
ColorGamma=(X=0.95, Y=0.98, Z=1.02, W=1.0)
