; ============================================================================
; DASI MMORPG - Unreal Engine 5 Environment Preset
; Devias_Atmosphere.ini
; Biome: Fortaleza Gélida de Boreal (Devias)
; Mood: Continuous blizzard, howling polar gales, deep glacial ice scattering, suspended ice crystals
; ============================================================================

[EnvironmentPreset]
PresetName="Devias_Boreal_Blizzard"
BiomeType="Devias"
TimeOfDay=13.5 ; Low Arctic solar culmination
bEnableDynamicWeather=True
DefaultSnowAccumulation=0.92
DefaultBlizzardWindStrength=1.45
BrazierThermalMeltRadius=650.0

; ----------------------------------------------------------------------------
; DIRECTIONAL LIGHT (Pale Arctic Sun Low on Horizon)
; ----------------------------------------------------------------------------
[/Script/Engine.DirectionalLightComponent]
Intensity=42000.0 ; Lumens (harsh high-latitude light diffused by blowing ice crystals)
LightColor=(R=225, G=242, B=255, A=255) ; Cool arctic white with slight cyan fringe
SourceAngle=2.4 ; Diffuse solar disk blurred by blizzard snow
Temperature=7400.0
bUseTemperature=True
VolumetricScatteringIntensity=2.85 ; Strong god rays piercing frozen fog
CastVolumetricShadow=True
CastCloudShadows=True
CloudShadowStrength=0.65
CascadeCount=4
CascadeDistributionExponent=2.8
DynamicShadowDistanceMovableLight=26000.0

; ----------------------------------------------------------------------------
; SKY ATMOSPHERE (Deep Glacial Arctic Scattering)
; ----------------------------------------------------------------------------
[/Script/Engine.SkyAtmosphereComponent]
AtmosphereHeight=50.0 ; km
RayleighScattering=(R=0.035, G=0.095, B=0.195) ; Deep arctic polar sky scattering
RayleighScatteringScale=0.065
MieScattering=(R=0.045, G=0.055, B=0.065) ; High airborne ice particle scattering
MieScatteringScale=0.0185
MieAbsorption=(R=0.001, G=0.001, B=0.001) ; Highly reflective non-absorbing ice crystals
MieAnisotropy=0.88 ; Strong forward scattering
GroundAlbedo=(R=0.88, G=0.94, B=1.0) ; High snow/ice albedo (reflects 90%+ solar flux upward)
MultiScatteringFactor=1.45 ; Intense ambient bounce from infinite snow sheet

; ----------------------------------------------------------------------------
; VOLUMETRIC CLOUDS (Violent Blizzard Overcast & Cirrus Ice Needles)
; ----------------------------------------------------------------------------
[/Script/Engine.VolumetricCloudComponent]
LayerBottomAltitude=1.2 ; km (very low blizzard cloud ceiling)
LayerHeight=3.5 ; km
TracingStartMaxDistance=150.0 ; km
TracingMaxDistance=280.0 ; km
Albedo=(R=0.90, G=0.94, B=0.98) ; Glacial white
ExtinctionCoeff=0.038
PhaseG=0.85
PhaseG2=-0.25
MultiScatteringApproximationOctaveCount=4
GroundContribution=0.65 ; Upward illumination from snow terrain into cloud bottoms

; ----------------------------------------------------------------------------
; EXPONENTIAL HEIGHT FOG (Dense Bluish Glacial Mist & Blowing Snow Haze)
; ----------------------------------------------------------------------------
[/Script/Engine.ExponentialHeightFogComponent]
FogDensity=0.052
FogHeightFalloff=0.0018 ; Blizzard extends several hundred meters above peaks
FogInscatteringColor=(R=0.45, G=0.68, B=0.88, A=1.0) ; Luminous glacial ice blue
DirectionalInscatteringColor=(R=0.85, G=0.92, B=1.0, A=1.0)
DirectionalInscatteringExponent=18.0
DirectionalInscatteringStartDistance=500.0
bEnableVolumetricFog=True
VolumetricFogScatteringDistribution=0.82 ; Extreme forward scatter on frozen fog droplets
VolumetricFogAlbedo=(R=0.85, G=0.92, B=0.98, A=1.0)
VolumetricFogExtinctionScale=3.5 ; Heavy visibility limitation (true blizzard feel)
VolumetricFogDistance=12000.0
SecondFogDensity=0.02
SecondFogHeightFalloff=0.0008
SecondFogHeightOffset=1500.0

; ----------------------------------------------------------------------------
; POST-PROCESS VOLUME (Frost Vignette, SSS Diffusion, Cold Blue Grading)
; ----------------------------------------------------------------------------
[/Script/Engine.PostProcessComponent]
bOverride_AutoExposureMethod=True
AutoExposureMethod=AEM_Manual
AutoExposureBias=1.35 ; Brightness compensation for dazzling snowfields
bOverride_BloomMethod=True
BloomMethod=BM_FFT
BloomIntensity=2.4 ; Star glints blooming intensely on micro-facet ice
BloomThreshold=0.95
bOverride_ColorSaturation=True
ColorSaturation=(X=0.95, Y=1.05, Z=1.18, W=1.0) ; Crisp glacial blue saturation
bOverride_ColorContrast=True
ColorContrast=(X=1.12, Y=1.10, Z=1.14, W=1.0)
bOverride_ColorGamma=True
ColorGamma=(X=0.95, Y=0.98, Z=1.02, W=1.0)
bOverride_VignetteIntensity=True
VignetteIntensity=0.42
bOverride_LumenSubsurfaceScattering=True
LumenSubsurfaceScatteringQuality=3.0 ; Maximum fidelity for glacial ice Beer-Lambert SSS

; ----------------------------------------------------------------------------
; ENVIRONMENTAL PARTICLES & WIND DYNAMICS
; ----------------------------------------------------------------------------
[DasiEnvironmentalVFX]
EnvironmentalNiagaraSystem="/Game/VFX/Niagara/Environments/NS_DeviasBlizzardSnow.NS_DeviasBlizzardSnow"
WindVelocityVector=(X=850.0, Y=220.0, Z=-150.0) ; Strong lateral blizzard gale
SnowflakeCountPerCubicMeter=450.0
FrostScreenPostProcessMaterial="/Game/Materials/PostProcess/PP_FrostScreenCondensation.PP_FrostScreenCondensation"

; ----------------------------------------------------------------------------
; WORLD PARTITION & STREAMING DATA LAYERS
; ----------------------------------------------------------------------------
[DasiWorldPartition]
GridCellSize=12800.0
LoadingRange=42000.0
HLODLayer_Default="/Game/World/HLOD/HLOD_DeviasPeaks"
HLODLayer_Fortress="/Game/World/HLOD/HLOD_DeviasFortress"
DataLayers=["DL_Devias_FrozenLake", "DL_Devias_FortressCore", "DL_Devias_IceQueenArena", "DL_Devias_GlacialCanyons"]
